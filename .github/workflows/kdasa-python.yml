name: KDASA Python checks

on:
  push:
    paths:
      - 'tools/*.py'
  pull_request:
    paths:
      - 'tools/*.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m compileall -q tools
      - name: Tests
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
